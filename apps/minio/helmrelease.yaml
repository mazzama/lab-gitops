apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minio
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.min.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: storage
spec:
  interval: 5m
  chart:
    spec:
      chart: minio
      version: "5.4.x"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
  valuesFrom:
  - kind: Secret
    name: minio-credentials
    valuesKey: rootUser
    targetPath: rootUser
  - kind: Secret
    name: minio-credentials
    valuesKey: rootPassword
    targetPath: rootPassword
  values:
    mode: standalone
    replicas: 1
    drivesPerNode: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: local-path
    service:
      type: NodePort
      port: 9000
      nodePort: 31900
    consoleService:
      type: NodePort
      port: 9001
      nodePort: 31901
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: "1"
