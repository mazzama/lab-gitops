apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-lab
  namespace: lab-infra
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: "2"
  postgresql:
    parameters:
      shared_buffers: 512MB
      max_connections: "200"
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: app
      owner: app
      encoding: UTF8
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-lab
  namespace: lab-infra
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg-lab
      cnpg.io/podRole: instance
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 15s
