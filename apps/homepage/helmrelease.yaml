apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jameswynn
  namespace: flux-system
spec:
  interval: 1h
  url: https://jameswynn.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: app-dev
spec:
  interval: 5m
  chart:
    spec:
      chart: homepage
      version: "2.1.x"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: flux-system
  values:
    env:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.28
    ingress:
      main:
        enabled: true
        ingressClassName: traefik
        hosts:
          - host: ""
            paths:
              - path: /
                pathType: Prefix
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: "1"
    config:
      useExistingConfigMap: homepage-config
