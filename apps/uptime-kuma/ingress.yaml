apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kuma
  namespace: app-dev
spec:
  ingressClassName: traefik
  rules:
  - host: kuma.azzam-lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uptime-kuma-uptime-kuma
            port:
              number: 80
