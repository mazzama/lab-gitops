apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "69.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  valuesFrom:
  - kind: Secret
    name: grafana-admin
    valuesKey: admin-user
    targetPath: grafana.adminUser
  - kind: Secret
    name: grafana-admin
    valuesKey: admin-password
    targetPath: grafana.adminPassword
  values:
    prometheus:
      prometheusSpec:
        retention: 10d
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: "1"
    grafana:
      ingress:
        enabled: true
        ingressClassName: traefik
        # grafana chart >= 8.10 (bundled with kube-prometheus-stack 69.x):
        # `hosts` must be a list of strings and `path`/`pathType` moved to the
        # ingress level. The old `hosts: [{host, paths}]` shape fails the render
        # (templates/ingress.yaml:37: wrong type for value; expected string).
        # Empty hosts = serve on any host, so /grafana stays reachable by IP.
        path: /grafana
        pathType: Prefix
        hosts: []
      grafana.ini:
        server:
          root_url: "%(protocol)s://%(domain)s/grafana"
          serve_from_sub_path: true
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 512Mi
          cpu: "1"
    alertmanager:
      enabled: true
    nodeExporter:
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 128Mi
