apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-discord-bridge
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-discord-bridge
  template:
    metadata:
      labels:
        app: flux-discord-bridge
    spec:
      containers:
      - name: bridge
        image: python:3.12-slim
        command: ["python3", "/app/bridge.py"]
        ports:
        - containerPort: 8080
        env:
        - name: DISCORD_URL
          valueFrom:
            secretKeyRef:
              name: discord-url
              key: address
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        - name: GITHUB_REPO
          value: "mazzama/lab-gitops"
        - name: DISCORD_USERNAME
          value: "FluxCD"
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: "1"
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: flux-discord-bridge
