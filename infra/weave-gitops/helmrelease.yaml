apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/weaveworks/charts/weave-gitops
  ref:
    tag: 4.0.36
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: weave-gitops
      version: "4.0.36"
      sourceRef:
        kind: OCIRepository
        name: weave-gitops
  values:
    adminUser:
      create: true
      username: admin
      createSecret: false
    createClusterRole: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
