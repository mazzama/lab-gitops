apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 1h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: tailscale-operator
      version: ">=0.0.0"
      sourceRef:
        kind: HelmRepository
        name: tailscale
  targetNamespace: tailscale
  install:
    createNamespace: true
  values:
    operatorConfig:
      defaultTags:
        - tag:k8s-operator
      extraEnv:
        - name: TS_USERSPACE
          value: "true"
    apiServerProxyConfig:
      mode: "true"
