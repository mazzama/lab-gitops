apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v1
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudnative-pg
      version: ">=0.0.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg
  values: {}
